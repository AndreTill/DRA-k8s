# Multi-node training: 4 реплики × 8 GPU
apiVersion: v1
kind: Service
metadata:
  name: train-llm
  namespace: ml-train
spec:
  clusterIP: None
  selector:
    app: train-llm
  ports:
  - name: rdzv
    port: 29500
    targetPort: 29500
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: train-llm
  namespace: ml-train
  labels:
    workload-type: training
    gpu-mode: physical
spec:
  serviceName: train-llm
  replicas: 4
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: train-llm
  template:
    metadata:
      labels:
        app: train-llm
        gpu-mode: physical
    spec:
      nodeSelector:
        node-role/gpu: ""
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: node-role
        operator: Equal
        value: gpu
        effect: NoSchedule
      containers:
      - name: trainer
        image: nvcr.io/nvidia/pytorch:24.12-py3
        command: ["bash", "-lc"]
        args:
          - |
            echo "=== nvidia-smi ==="
            nvidia-smi
            echo "Node: ${HOSTNAME}"
            # Реальный запуск:
            # torchrun --nnodes=4 --nproc_per_node=8 \
            #   --rdzv_backend=c10d \
            #   --rdzv_endpoint=train-llm-0.train-llm:29500 \
            #   train.py
            python -c "
            import torch, os
            print(f'CUDA: {torch.cuda.is_available()}, count={torch.cuda.device_count()}')
            print(f'Host: {os.environ.get(\"HOSTNAME\")}')
            print('multi-node training placeholder ready')
            "
            sleep 3600
        ports:
        - name: rdzv
          containerPort: 29500
        resources:
          limits:
            nvidia.com/gpu: "8"
            cpu: "32"
            memory: "256Gi"
          requests:
            cpu: "16"
            memory: "128Gi"
