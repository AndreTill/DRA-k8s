# Legacy smoke: классический device plugin (nvidia.com/gpu)
# Работает только если на узле активен NVIDIA device plugin (не DRA).
apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke-classic
  namespace: default
  labels:
    workload-type: smoke
    gpu-mode: device-plugin
spec:
  restartPolicy: Never
  containers:
  - name: cuda
    image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
    resources:
      limits:
        nvidia.com/gpu: "1"
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
